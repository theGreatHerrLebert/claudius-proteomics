  key_findings:
    value: "The receptor tyrosine kinase inhibitor ponatinib disrupts alternative lengthening of telomeres (ALT) by inducing telomeric C-circles, telomere dysfunction and reduced telomere synthesis, acting through an ABL1-JNK-JUN signalling circuit. SILAC phosphoproteomics and proteomics of ponatinib-treated SAOS-2 cells identified reduced JUN and EPHA2 phosphorylation, supporting ponatinib as a repurposable, clinically approved drug for ALT cancers."
