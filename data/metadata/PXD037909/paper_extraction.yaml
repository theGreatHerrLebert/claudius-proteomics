  key_findings:
    value: "Quantitative label-free proteomics of primary human myotubes showed that glycolytic, apoptotic, hypoxia and cellular stress pathways were upregulated whereas the pentose phosphate and lipid biosynthetic pathways were downregulated in cells from donors with obesity compared to lean donors. Combined with substrate oxidation assays, myotubes from individuals with obesity showed increased fatty acid, glucose and amino acid uptake, while EPA pretreatment enhanced glucose metabolism and metabolic flexibility."
