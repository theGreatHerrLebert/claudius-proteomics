# CLAUDIUS-PROTEOMICS Configuration
# ==================================

# Datasets to process (PRIDE accession numbers)
datasets:
  - PXD019086  # Meier et al. 2021 - CCS prediction study
  - PXD046675  # Pig muscle 4D-LFQ (Wannanhua, timsTOF Pro)
  - PXD069059  # Ovine macrophage differentiation (timsTOF Pro, DDA)
  - PXD019746  # Ogata et al. 2021 - phospho CCS on timsTOF (jPOST)
