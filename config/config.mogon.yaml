# Contaminants database (appended to all FASTA files)
contaminants:
  enabled: true
  source: "cRAP"  # Common Repository of Adventitious Proteins
  url: "http://ftp.thegpm.org/fasta/cRAP/crap.fasta"

# Enzyme definitions for search engines
# Each enzyme has engine-specific syntax for FragPipe, DIA-NN, and Sage
enzymes:
  trypsin:
    cleave_at: "KR"
    restrict: "P"
    terminal: "C"
    missed_cleavages: 2
    fragpipe_name: "trypsin"
    diann_cut: "K*,R*,!*P"
    sage_cleave_at: "KR"
    sage_restrict: "P"
  lysc:
    cleave_at: "K"
    restrict:
    terminal: "C"
    missed_cleavages: 2
    fragpipe_name: "lysc"
    diann_cut: "K*"
    sage_cleave_at: "K"
    sage_restrict:
  lysn:
    cleave_at: "K"
    restrict:
    terminal: "N"
    missed_cleavages: 2
    fragpipe_name: "lysn"
    diann_cut: "*K"
    sage_cleave_at: "K"
    sage_restrict:
  nonspecific:
    cleave_at: ""
    restrict:
    terminal:
    missed_cleavages: 0
    fragpipe_name: "nonspecific"
    diann_cut: ""
    sage_cleave_at: ""
    sage_restrict:

