  - PXD068782  # Chlamydomonas phospho-proteome, CDKL5 kinase (timsTOF Pro 2)

# Dataset metadata: bias-aware fields (manually verified from publication)
# Organism mapping is now handled automatically by sample_group_resolver.py
dataset_metadata:
