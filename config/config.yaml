# CLAUDIUS-PROTEOMICS Configuration
# ==================================

# Datasets to process (PRIDE accession numbers)
datasets:
  - PXD019086  # Meier et al. 2021 - CCS prediction study

# Dataset metadata: organism mapping and bias-aware fields
# Maps PRIDE accession to organism for automatic FASTA selection
# These values are used as fallback if automatic extraction fails
dataset_metadata:
  PXD019086:
    organism: "human"
    description: "Meier et al. 2021 - HeLa tryptic digest for CCS prediction"
    instrument: "timsTOF Pro"
    # Bias-aware fields (manually verified from publication)
    lab_id: "Max Planck Institute of Biochemistry"
    gradient_length: 120  # minutes (from LC method name "120min")
    column_type: "C18 25cm nanoLC"  # From publication methods
    acquisition_mode: "PASEF"  # DDA-PASEF

# Download settings for PRIDE data
download:
  protocol: "ftp"  # ftp | aspera (aspera requires ascp client)
  retry_count: 3
  file_patterns:
    - "*.d.zip"
    - "*.d.tar"
    - "*.d"
    - "*.raw"

# Organism FASTA configuration
# Local paths or UniProt IDs for automatic download
organisms:
  human:
    taxon_id: 9606
    proteome_id: "UP000005640"
    local_fasta: "/home/dateschn/rust/sim/human_20365_conts_172_2020-3-2_2-0-11_validated.fasta"
    includes_contaminants: true  # Local FASTA already has 172 cRAP contaminants
    # If local_fasta not available, will download from UniProt
  yeast:
    taxon_id: 559292
    proteome_id: "UP000002311"
    local_fasta: null  # Will download from UniProt
  ecoli:
    taxon_id: 83333
    proteome_id: "UP000000625"
    local_fasta: null
  mouse:
    taxon_id: 10090
    proteome_id: "UP000000589"
    local_fasta: null

# Contaminants database (appended to all FASTA files)
contaminants:
  enabled: true
  source: "cRAP"  # Common Repository of Adventitious Proteins
  url: "http://ftp.thegpm.org/fasta/cRAP/crap.fasta"

# Local data paths (for testing without PRIDE download)
local_data:
  PXD019086: "/home/dateschn/raw-data/Raw_HeLa_Trp"

# FragPipe configuration
fragpipe:
  path: "/home/dateschn/validate-sim/third-party/fragpipe/fragpipe24/fragpipe-24.0"
  workflow: "LFQ-MBR"  # Good default for DDA timsTOF with match-between-runs
  threads: 64
  memory_gb: 128

# DIA-NN configuration (v2.3.2 supports DDA mode)
diann:
  path: "/home/dateschn/validate-sim/third-party/diann/diann-2.3/diann-2.3.2/diann-2.3.2/diann-linux"
  threads: 64
  qvalue: 1.0  # Report ALL results - no q-value filtering (San José applies thresholds at query time)
  # DIA-NN 2.3+ can run in DDA mode with --dda flag

# Sage configuration (fast Rust-based search engine)
sage:
  path: "/home/dateschn/rust/sage/target/release/sage"
  config: "config/sage_config.json"
  threads: 64
  # Sage uses timsrust for reading Bruker .d files

# San José mode: report ALL results without FDR/PEP filtering
# Thresholds are applied at query time, not during search
san_jose:
  report_all: true  # Disable FDR filtering in all search engines

# Raw extraction settings (imspy)
extraction:
  mz_tolerance_ppm: 20
  rt_tolerance_sec: 6  # Total window = ±3s around apex (typical elution ~3s)
  mobility_tolerance: 0.05
  extract_chromatogram: true
  extract_mobilogram: true
  extract_isotopes: true
  batch_size: 10000  # Precursors per batch (reduces peak memory from ~65GB to ~10GB)
  threads: 8  # Threads for MS1 extraction

# Model training settings
training:
  test_split: 0.1
  validation_split: 0.1
  batch_size: 256
  epochs: 100
  early_stopping_patience: 10

# Models to train
models:
  - ccs_v1

# Container paths (built Singularity images)
containers:
  download: "containers/download.sif"
  fragpipe_base: "containers/fragpipe-base.sif"
  imspy: "containers/imspy.sif"

# Test mode: use subset of data for quick validation
test_mode:
  enabled: true
  max_files: 3

# Temp directory for MSFragger cache files (use SSD for performance)
# This avoids writing cache files next to raw data on potentially full drives
temp_dir: "/home/dateschn/claudius-proteomics/tmp"
