# CLAUDIUS-PROTEOMICS Configuration
# ==================================

# Datasets to process (PRIDE accession numbers)
# For local testing, we use pre-downloaded data
datasets:
  - PXD019086  # Meier et al. 2021 - CCS prediction study

# Local data paths (for testing without PRIDE download)
local_data:
  PXD019086: "/media/hd02/data/raw/dda/ccs/Raw_HeLa_Trp"

# FragPipe configuration
fragpipe:
  path: "/home/administrator/fragpipe/fragpipe/fragpipe24/fragpipe-24.0"
  workflow: "Default"
  threads: 16
  memory_gb: 64

# Database for FragPipe search
database:
  fasta: "/home/administrator/Documents/promotion/ccs-workflow/rescoring/data/human_20365_conts_172_2020-3-2_2-0-11_validated.fasta"

# Raw extraction settings (imspy)
extraction:
  # Ion distribution extraction
  mz_tolerance_ppm: 20
  rt_tolerance_sec: 30
  mobility_tolerance: 0.05

  # Features to extract
  extract_chromatogram: true
  extract_mobilogram: true
  extract_isotopes: true

# Model training settings
training:
  test_split: 0.1
  validation_split: 0.1
  batch_size: 256
  epochs: 100
  early_stopping_patience: 10

# Models to train
models:
  - ccs_v1

# Container paths (built Singularity images)
containers:
  download: "containers/download.sif"
  fragpipe_base: "containers/fragpipe-base.sif"
  imspy: "containers/imspy.sif"

# Test mode: use subset of data for quick validation
test_mode:
  enabled: true
  max_files: 3  # Only process first N .d files
